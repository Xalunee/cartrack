<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- CarTrack mark: a CT monogram read as road geometry.
       Literal colours on purpose — this file has to work standalone
       (favicon, PNG source, Telegram avatar), outside the CSS cascade.
       The token for the same blue lives in globals.css as the brand-mark custom property. -->
  <rect width="120" height="120" rx="27" fill="#2383E2"/>

  <!-- C: a road curve. White arc, then a thin plate-coloured stroke
       knocked back over it as a solid centre marking. -->
  <g transform="translate(41, 60)">
    <path d="M15.5 -23.5 A 19.5 19.5 0 1 0 15.5 23.5" fill="none" stroke="#fff" stroke-width="8.2" stroke-linecap="round"/>
    <path d="M15.5 -23.5 A 19.5 19.5 0 1 0 15.5 23.5" fill="none" stroke="#2383E2" stroke-width="1.7" stroke-linecap="round"/>
  </g>

  <!-- T: crossbar plus a tapering stem. Its strokes are deliberately
       thinner than the C's so the arc keeps the visual weight, and its
       centre marking is dashed where the C's is solid — two different
       real road markings, and the contrast is the point. -->
  <g transform="translate(83, 60)">
    <line x1="-14" y1="-24" x2="14" y2="-24" stroke="#fff" stroke-width="7.4" stroke-linecap="round"/>
    <path d="M-4.4 -20.5 L-6.4 25 L6.4 25 L4.4 -20.5 Z" fill="#fff"/>
    <line x1="0" y1="-15" x2="0" y2="21" stroke="#2383E2" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="3.3 4.6"/>
  </g>
</svg>
